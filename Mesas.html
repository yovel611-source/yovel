<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesas de Caballeros · Evaluación</title>
<meta name="description" content="Evaluación de las Mesas de Caballeros — Red de Hombres, Iglesia Semillas de Vida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Bitter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yunque:#23262B;
  --yunque-2:#2C3037;
  --yunque-3:#383D46;
  --placa:#EDE7DA;
  --placa-2:#DCD3C0;
  --tinta:#191B1F;
  --acero:#818995;
  --laton:#B98B3E;
  --oxido:#9A4231;
  --brasa:#C97B2C;
  --frio:#5C7286;
  --acento:var(--laton);
  --r:14px;
  --stage-h:clamp(300px,52vh,420px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--yunque);
  background-image:radial-gradient(120% 70% at 50% 0%,var(--yunque-2) 0%,var(--yunque) 62%);
  color:var(--placa);
  font-family:'Archivo',system-ui,sans-serif;
  display:flex;justify-content:center;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#app{
  width:100%;max-width:520px;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:18px 20px 24px;
}

/* ---------- tipografía base ---------- */
.eyebrow{
  font-size:.66rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--acero);
}
.display{
  font-weight:800;line-height:.92;letter-spacing:-.015em;text-transform:uppercase;
  font-size:clamp(2.4rem,11vw,3.4rem);
}
.serif{font-family:'Bitter',Georgia,serif}
.lead{font-family:'Bitter',Georgia,serif;font-weight:500;line-height:1.55;color:#CFC8B9}

/* ---------- barra de progreso: 4 placas ---------- */
#hud{display:none;gap:6px;margin-bottom:16px}
#hud.on{display:flex}
.seg{flex:1;position:relative}
.seg .bar{height:4px;border-radius:2px;background:var(--yunque-3);overflow:hidden}
.seg .fill{display:block;height:100%;width:0;background:var(--c);transition:width .35s ease}
.seg .lbl{
  display:block;margin-top:7px;font-size:.55rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:#5C636E;transition:color .3s
}
.seg.live .lbl{color:var(--c)}
.seg.done .lbl{color:var(--acero)}

/* ---------- escenario ---------- */
#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:var(--stage-h)}
.sheet{width:100%}

/* tarjeta de afirmación */
.card{
  position:relative;width:100%;background:var(--placa);color:var(--tinta);
  border-radius:var(--r);padding:34px 26px 30px;
  box-shadow:0 18px 40px -18px #000,0 2px 0 var(--placa-2) inset;
  touch-action:pan-y;cursor:grab;user-select:none;
  border-top:5px solid var(--c,var(--laton));
}
.card:active{cursor:grabbing}
.card .num{
  font-size:.62rem;font-weight:700;letter-spacing:.16em;color:#8C8471;text-transform:uppercase;
  display:block;margin-bottom:16px
}
.card .stmt{
  font-family:'Bitter',Georgia,serif;font-weight:600;line-height:1.34;
  font-size:clamp(1.18rem,5.2vw,1.5rem);letter-spacing:-.01em
}
.stamp{
  position:absolute;top:20px;font-weight:800;font-size:1.5rem;letter-spacing:.14em;
  padding:6px 14px;border:3px solid;border-radius:6px;opacity:0;pointer-events:none
}
.stamp.si{right:20px;color:var(--laton);border-color:var(--laton);transform:rotate(11deg)}
.stamp.no{left:20px;color:var(--oxido);border-color:var(--oxido);transform:rotate(-11deg)}

/* placa de bloque */
.plate{width:100%;text-align:center;padding:8px 4px}
.plate .rn{
  font-size:.8rem;font-weight:800;letter-spacing:.4em;color:var(--c);margin-bottom:18px
}
.plate h2{
  font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.95;
  font-size:clamp(2rem,9vw,2.8rem);margin-bottom:18px
}
.plate .rule{width:56px;height:2px;background:var(--c);margin:0 auto 18px}
.plate p{max-width:34ch;margin:0 auto}

/* pregunta abierta */
.open label{display:block;margin-bottom:14px}
.open .qtag{font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:10px}
.open .q{font-family:'Bitter',Georgia,serif;font-weight:600;font-size:clamp(1.08rem,4.6vw,1.3rem);line-height:1.4}
textarea{
  width:100%;min-height:132px;resize:vertical;background:var(--placa);color:var(--tinta);
  border:none;border-radius:var(--r);padding:16px;font-family:'Bitter',Georgia,serif;
  font-size:1rem;line-height:1.5;border-top:5px solid var(--c)
}
textarea:focus{outline:3px solid var(--c);outline-offset:2px}
.hintline{margin-top:10px;font-size:.75rem;color:var(--acero)}

/* ---------- controles ---------- */
#controls{margin-top:22px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{
  font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  font-size:.9rem;padding:19px 16px;border-radius:12px;border:2px solid;cursor:pointer;
  background:transparent;transition:background .15s,color .15s,transform .08s
}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--placa);outline-offset:3px}
.btn.no{color:var(--oxido);border-color:var(--oxido)}
.btn.no:hover{background:var(--oxido);color:var(--placa)}
.btn.si{color:var(--laton);border-color:var(--laton)}
.btn.si:hover{background:var(--laton);color:var(--tinta)}
.btn.solid{width:100%;background:var(--acento);border-color:var(--acento);color:var(--tinta)}
.btn.ghost{width:100%;color:var(--acero);border-color:var(--yunque-3)}
.btn.ghost:hover{color:var(--placa);border-color:var(--acero)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.subrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;min-height:22px}
.linkbtn{
  background:none;border:none;color:var(--acero);font-family:inherit;font-size:.75rem;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:4px
}
.linkbtn:hover{color:var(--placa)}
.linkbtn[hidden]{visibility:hidden;display:block}
.count{font-size:.72rem;color:#5C636E;font-weight:600;letter-spacing:.1em;font-variant-numeric:tabular-nums}

/* ---------- portada ---------- */
.hero{padding:14px 0}
.hero .display{margin:12px 0 18px}
.hero .display span{display:block;color:var(--laton)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
.pill{
  font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--yunque-3);border-radius:99px;padding:7px 12px;color:var(--acero)
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  font-family:inherit;font-size:.78rem;font-weight:700;letter-spacing:.06em;cursor:pointer;
  border:1px solid var(--yunque-3);background:transparent;color:var(--acero);
  border-radius:99px;padding:9px 15px;transition:all .15s
}
.chip[aria-pressed="true"]{background:var(--laton);border-color:var(--laton);color:var(--tinta)}
.field{margin-top:20px}
.field .eyebrow{margin-bottom:10px}
input[type=text],input[type=tel]{
  width:100%;background:var(--yunque-2);border:1px solid var(--yunque-3);border-radius:10px;
  padding:14px 15px;color:var(--placa);font-family:inherit;font-size:1rem
}
input:focus{outline:2px solid var(--laton);outline-offset:1px}
.checkrow{display:flex;gap:12px;align-items:flex-start;margin-top:16px;cursor:pointer}
.checkrow input{margin-top:3px;width:20px;height:20px;accent-color:var(--laton);flex:none}
.checkrow span{font-size:.88rem;line-height:1.45;color:#CFC8B9}

/* ---------- cierre ---------- */
.tally{margin:24px 0 6px}
.tally .row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tally .name{flex:none;width:104px;font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.tally .track{flex:1;height:8px;background:var(--yunque-3);border-radius:4px;overflow:hidden}
.tally .val{display:block;height:100%;background:var(--c);width:0;transition:width .8s cubic-bezier(.22,1,.36,1)}
.tally .n{flex:none;font-size:.78rem;font-weight:700;color:var(--acero);font-variant-numeric:tabular-nums;width:38px;text-align:right}
.note{margin-top:8px;padding:16px;border-left:3px solid var(--laton);background:var(--yunque-2);border-radius:0 10px 10px 0}
.note p{font-size:.9rem;line-height:1.5;color:#CFC8B9}
footer{margin-top:26px;text-align:center;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#4E545E;font-weight:700}
.err{margin-top:14px;padding:14px;border-radius:10px;background:#3A2320;border:1px solid var(--oxido);font-size:.85rem;line-height:1.45}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="hud" aria-hidden="true"></div>
  <main id="stage"></main>
  <div id="controls"></div>
  <footer>Red de Hombres · Semillas de Vida</footer>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   CONFIGURACIÓN — lo único que necesitas tocar
   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  // Pega aquí la URL /exec de tu Apps Script publicado como app web
  endpoint: "https://script.google.com/macros/s/AKfycbwLq4VV88IxxksprwkLgMoIhncACTOv9B6boKSQj8k3U5CZdCpUQmV7sSjsAHaDzLt9Ng/exec",
  // Link público de esta misma encuesta (para el botón de compartir)
  enlacePublico: "https://yovel611-source.github.io/yovel/Mesas.html",
  // Años en los que se han hecho las mesas
  anios: ["2024","2025","No recuerdo"]
};

/* ══════════════════════════════════════════════════════════
   CONTENIDO
   ══════════════════════════════════════════════════════════ */
const BLOQUES = {
  F:{n:"1", nombre:"Lo bueno",      corto:"Lo bueno",     color:"#B98B3E", total:6,
     lead:"Arranquemos por lo que sí funcionó. Responde SÍ solo si de verdad lo viviste así, no por quedar bien."},
  D:{n:"2", nombre:"Lo que falla",  corto:"Lo que falla", color:"#9A4231", total:6,
     lead:"Aquí toca ser sincero. Decir que SÍ no es quejarse: es lo único que nos sirve para arreglarlo."},
  O:{n:"3", nombre:"Lo que falta",  corto:"Lo que falta", color:"#C97B2C", total:5,
     lead:"Cosas que podríamos sumar. Marca lo que de verdad harías, no lo que suena bonito."},
  A:{n:"4", nombre:"Lo que frena",  corto:"Lo que frena", color:"#5C7286", total:5,
     lead:"Lo que te complica ir o seguir yendo. Nadie va a saber quién respondió qué."}
};

const FLUJO = [
  {t:"placa",b:"F"},
  {t:"card",b:"F",id:"F1",txt:"Lo que vimos me ayudó a crecer espiritualmente."},
  {t:"card",b:"F",id:"F2",txt:"Los temas me sirvieron en varias áreas de mi vida."},
  {t:"card",b:"F",id:"F3",txt:"Me sentí en confianza para hablar y dar mi opinión."},
  {t:"card",b:"F",id:"F4",txt:"Lo que se enseña desde la Biblia es claro y se puede aplicar."},
  {t:"card",b:"F",id:"F5",txt:"Los que dirigen las mesas manejan bien las conversaciones."},
  {t:"card",b:"F",id:"F6",txt:"Las sesiones me motivaron a ser mejor en mi casa, en el trabajo y conmigo mismo."},
  {t:"abierta",b:"F",id:"FA1",q:"¿Qué es lo mejor que tienen las mesas de caballeros?",
   hint:"Lo que le dirías a un amigo si te pregunta por qué vale la pena ir."},
  {t:"abierta",b:"F",id:"FA2",q:"¿Qué otros temas te gustaría que tocáramos?",
   hint:"Entre más concreto, mejor."},

  {t:"placa",b:"D"},
  {t:"card",b:"D",id:"D1",txt:"Las reuniones no están bien organizadas."},
  {t:"card",b:"D",id:"D2",txt:"Siento que faltó profundizar en algunos temas."},
  {t:"card",b:"D",id:"D3",txt:"Me cuesta ir de forma constante."},
  {t:"card",b:"D",id:"D4",txt:"No me resulta fácil aplicar lo aprendido en el día a día."},
  {t:"card",b:"D",id:"D5",txt:"El horario o la duración de las sesiones no funcionan bien."},
  {t:"card",b:"D",id:"D6",txt:"Las mesas se sienten monótonas y poco dinámicas."},
  {t:"abierta",b:"D",id:"DA1",q:"¿Qué harías tú para que las sesiones sean mejores?",
   hint:"Si marcaste algún SÍ arriba, cuéntanos cómo se arreglaría."},

  {t:"placa",b:"O"},
  {t:"card",b:"O",id:"O1",txt:"Me gustaría tener material de apoyo: guías, lecturas, tareas."},
  {t:"card",b:"O",id:"O2",txt:"Me gustaría que hubiera más actividades: retiros, talleres, cine-foro."},
  {t:"card",b:"O",id:"O3",txt:"Me serviría que se tocaran temas como finanzas, liderazgo, matrimonio, familia o hábitos."},
  {t:"card",b:"O",id:"O4",txt:"Estaría dispuesto a que alguien me haga seguimiento o me acompañe como mentor."},
  {t:"card",b:"O",id:"O5",txt:"Invitaría a otros hombres a participar."},
  {t:"abierta",b:"O",id:"OA1",q:"¿Le recomendarías este espacio a otros hombres? ¿Por qué?",
   hint:"El porqué nos sirve más que el sí."},
  {t:"abierta",b:"O",id:"OA2",q:"¿Qué más agregarías que no te hayamos preguntado?",
   hint:"Cualquier cosa que creas que hace falta."},

  {t:"placa",b:"A"},
  {t:"card",b:"A",id:"A1",txt:"El trabajo o la familia me dificultan asistir."},
  {t:"card",b:"A",id:"A2",txt:"No siempre tengo ganas de ir."},
  {t:"card",b:"A",id:"A3",txt:"Ha habido enfoques con los que no me he sentido cómodo."},
  {t:"card",b:"A",id:"A4",txt:"Si no veo resultados pronto, podría dejar de ir."},
  {t:"card",b:"A",id:"A5",txt:"No me queda claro para dónde va el grupo."},
  {t:"abierta",b:"A",id:"AA1",q:"¿Qué se necesita para que estas mesas funcionen bien de aquí en adelante?",
   hint:"Dilo como si te tocara a ti organizarlas."}
];

/* ══════════════════════════════════════════════════════════
   ESTADO
   ══════════════════════════════════════════════════════════ */
const stage = document.getElementById("stage");
const controls = document.getElementById("controls");
const hud = document.getElementById("hud");
const CARDS = FLUJO.filter(s => s.t === "card");

const estado = {
  i: -1,
  respuestas: {},
  textos: {},
  anios: [],
  contacto: { nombre: "", whatsapp: "", mentoria: false },
  inicio: Date.now()
};

/* ══════════════════════════════════════════════════════════
   HUD
   ══════════════════════════════════════════════════════════ */
function pintarHud(){
  const activo = FLUJO[estado.i] ? FLUJO[estado.i].b : null;
  hud.innerHTML = Object.keys(BLOQUES).map(k => {
    const b = BLOQUES[k];
    const n = CARDS.filter(c => c.b === k && estado.respuestas[c.id] !== undefined).length;
    const pct = Math.round(n / b.total * 100);
    const cls = k === activo ? "live" : (n === b.total ? "done" : "");
    return `<div class="seg ${cls}" style="--c:${b.color}">
      <div class="bar"><span class="fill" style="width:${pct}%"></span></div>
      <span class="lbl">${b.corto}</span>
    </div>`;
  }).join("");
}

/* ══════════════════════════════════════════════════════════
   PANTALLAS
   ══════════════════════════════════════════════════════════ */
function portada(){
  hud.classList.remove("on");
  stage.innerHTML = `
    <div class="sheet hero">
      <p class="eyebrow">Red de Hombres · Iglesia Semillas de Vida</p>
      <h1 class="display">Mesas de<span>Caballeros</span></h1>
      <p class="lead">Como participante de las anteriores “Mesas de caballeros” te invitamos a que nos ayudes realizando esta encuesta. La finalidad es evaluar la dinámica, la profundidad temática, el impacto real sobre los diferentes roles que cumples en la sociedad y la relevancia que han tenido para ti los principios revisados en las mesas de caballeros.</p>
      <div class="meta">
        <span class="pill">22 preguntas</span>
        <span class="pill">Sí o no</span>
        <span class="pill">≈ 4 minutos</span>
      </div>
      <p class="lead" style="font-size:.92rem">No hay escalas ni puntos medios, solo sí o no. Al final hay seis preguntas para escribir, y ahí es donde más nos ayudas. El plazo máximo para llenar la encuesta es el viernes 14 a las 6 de la tarde. Contamos contigo.</p>
      <div class="field">
        <p class="eyebrow">¿En qué año participaste?</p>
        <div class="chips" id="chips">${CONFIG.anios.map(a =>
          `<button type="button" class="chip" aria-pressed="false" data-a="${a}">${a}</button>`).join("")}</div>
      </div>
    </div>`;
  controls.innerHTML = `<button class="btn solid" id="go">Empezar</button>
    <div class="subrow"><span class="count">Puedes responder sin poner tu nombre</span></div>`;
  document.getElementById("chips").addEventListener("click", e => {
    const c = e.target.closest(".chip"); if(!c) return;
    const on = c.getAttribute("aria-pressed") === "true";
    c.setAttribute("aria-pressed", String(!on));
    const a = c.dataset.a;
    estado.anios = on ? estado.anios.filter(x => x !== a) : estado.anios.concat(a);
  });
  document.getElementById("go").onclick = () => avanzar();
}

function placa(paso){
  const b = BLOQUES[paso.b];
  document.documentElement.style.setProperty("--acento", b.color);
  stage.innerHTML = `<div class="sheet plate" style="--c:${b.color}">
      <p class="rn">Parte ${b.n} de 4</p>
      <h2>${b.nombre}</h2>
      <div class="rule"></div>
      <p class="lead">${b.lead}</p>
    </div>`;
  controls.innerHTML = `<button class="btn solid" id="next">Continuar</button>
    <div class="subrow"><button class="linkbtn" id="undo">← Atrás</button><span class="count">${b.total} preguntas</span></div>`;
  document.getElementById("next").onclick = () => avanzar();
  const u = document.getElementById("undo"); if(u) u.onclick = deshacer;
}

function tarjeta(paso){
  const b = BLOQUES[paso.b];
  const idx = CARDS.indexOf(paso) + 1;
  document.documentElement.style.setProperty("--acento", b.color);
  stage.innerHTML = `<div class="sheet"><article class="card" id="card" style="--c:${b.color}">
      <span class="num">${b.nombre}</span>
      <p class="stmt">${paso.txt}</p>
      <span class="stamp si">SÍ</span>
      <span class="stamp no">NO</span>
    </article></div>`;
  controls.innerHTML = `<div class="duo">
      <button class="btn no" id="bNo">No</button>
      <button class="btn si" id="bSi">Sí</button>
    </div>
    <div class="subrow">
      <button class="linkbtn" id="undo">← Atrás</button>
      <span class="count">${idx} / ${CARDS.length}</span>
    </div>`;
  document.getElementById("bNo").onclick = () => responder(paso, false);
  document.getElementById("bSi").onclick = () => responder(paso, true);
  document.getElementById("undo").onclick = deshacer;
  arrastrar(document.getElementById("card"), paso);
}

function abierta(paso){
  const b = BLOQUES[paso.b];
  document.documentElement.style.setProperty("--acento", b.color);
  const prev = estado.textos[paso.id] || "";
  stage.innerHTML = `<div class="sheet open" style="--c:${b.color}">
      <label for="ta">
        <span class="qtag">${b.nombre} · para escribir</span>
        <span class="q">${paso.q}</span>
      </label>
      <textarea id="ta" rows="5" placeholder="Escribe aquí…">${prev}</textarea>
      <p class="hintline">${paso.hint}</p>
    </div>`;
  controls.innerHTML = `<button class="btn solid" id="next">Siguiente</button>
    <div class="subrow"><button class="linkbtn" id="undo">← Atrás</button><button class="linkbtn" id="skip">Prefiero no responder</button></div>`;
  const ta = document.getElementById("ta");
  document.getElementById("next").onclick = () => { estado.textos[paso.id] = ta.value.trim(); avanzar(); };
  document.getElementById("skip").onclick = () => { estado.textos[paso.id] = ""; avanzar(); };
  document.getElementById("undo").onclick = deshacer;
}

function cierre(){
  document.documentElement.style.setProperty("--acento", "#B98B3E");
  hud.classList.remove("on");
  stage.innerHTML = `<div class="sheet">
      <p class="eyebrow">Ya casi</p>
      <h2 class="display" style="font-size:clamp(1.9rem,8vw,2.6rem);margin:10px 0 16px">Antes de<br>enviar</h2>
      <p class="lead" style="font-size:.95rem">Esto es opcional. Llénalo solo si quieres que alguien te escriba.</p>
      <div class="field">
        <label class="eyebrow" for="nom">Nombre</label>
        <input type="text" id="nom" autocomplete="name" placeholder="Opcional">
      </div>
      <div class="field">
        <label class="eyebrow" for="wa">WhatsApp</label>
        <input type="tel" id="wa" autocomplete="tel" placeholder="Opcional">
      </div>
      <label class="checkrow">
        <input type="checkbox" id="men">
        <span>Me gustaría que me contacten para hacerme seguimiento o acompañarme.</span>
      </label>
    </div>`;
  controls.innerHTML = `<button class="btn solid" id="send">Enviar mis respuestas</button>
    <div class="subrow"><button class="linkbtn" id="undo">← Atrás</button><span class="count">Ya respondiste las 22</span></div>
    <div id="errbox"></div>`;
  document.getElementById("undo").onclick = deshacer;
  document.getElementById("send").onclick = enviar;
}

function gracias(){
  hud.classList.remove("on");
  const tally = Object.keys(BLOQUES).map(k => {
    const b = BLOQUES[k];
    const si = CARDS.filter(c => c.b === k && estado.respuestas[c.id] === true).length;
    return `<div class="row" style="--c:${b.color}">
      <span class="name">${b.corto}</span>
      <span class="track"><i class="val" data-w="${si / b.total * 100}"></i></span>
      <span class="n">${si}/${b.total}</span>
    </div>`;
  }).join("");
  const abiertas = Object.values(estado.textos).filter(t => t && t.length).length;
  stage.innerHTML = `<div class="sheet">
      <p class="eyebrow">Listo</p>
      <h2 class="display" style="font-size:clamp(2rem,9vw,2.8rem);margin:10px 0 18px">Gracias<br>por<br><span style="color:var(--laton)">responder</span></h2>
      <p class="lead" style="font-size:.95rem">22 preguntas y ${abiertas} ${abiertas === 1 ? "comentario" : "comentarios"}. Esto fue lo que marcaste con un SÍ:</p>
      <div class="tally">${tally}</div>
      <div class="note"><p>Nadie va a ver tu nombre al lado de tus respuestas. Y lo que escribiste sí se va a usar: en la próxima convocatoria vas a reconocer cosas que salieron de aquí.</p></div>
    </div>`;
  const texto = encodeURIComponent(`Acabo de responder la encuesta de las Mesas de Caballeros. Son 4 minutos y sí va a servir para mejorar las próximas. Ahí te va: ${CONFIG.enlacePublico}`);
  controls.innerHTML = `<a class="btn solid" style="display:block;text-align:center;text-decoration:none"
      href="https://wa.me/?text=${texto}" target="_blank" rel="noopener">Compartir con otro</a>`;
  requestAnimationFrame(() => {
    document.querySelectorAll(".tally .val").forEach(v => { v.style.width = v.dataset.w + "%"; });
  });
}

/* ══════════════════════════════════════════════════════════
   NAVEGACIÓN
   ══════════════════════════════════════════════════════════ */
function avanzar(){
  estado.i++;
  if(estado.i >= FLUJO.length){ cierre(); return; }
  render();
}

function deshacer(){
  if(estado.i <= 0){ estado.i = -1; portada(); return; }
  estado.i = Math.min(estado.i, FLUJO.length) - 1;
  const p = FLUJO[estado.i];
  if(p && p.t === "card") delete estado.respuestas[p.id];
  render();
}

function render(){
  const paso = FLUJO[estado.i];
  if(!paso){ cierre(); return; }
  hud.classList.add("on");
  pintarHud();
  if(paso.t === "placa") placa(paso);
  else if(paso.t === "card") tarjeta(paso);
  else abierta(paso);
  stage.scrollIntoView({block:"nearest"});
}

function responder(paso, valor){
  estado.respuestas[paso.id] = valor;
  const card = document.getElementById("card");
  if(card && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    card.style.transition = "transform .28s ease-in, opacity .28s ease-in";
    card.style.transform = `translateX(${valor ? 130 : -130}%) rotate(${valor ? 14 : -14}deg)`;
    card.style.opacity = "0";
    setTimeout(avanzar, 190);
  } else {
    avanzar();
  }
}

/* arrastre con puntero */
function arrastrar(card, paso){
  let x0 = 0, dx = 0, activo = false;
  const si = card.querySelector(".stamp.si"), no = card.querySelector(".stamp.no");
  const UMBRAL = Math.min(110, window.innerWidth * 0.28);

  card.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse" && e.button !== 0) return;
    activo = true; x0 = e.clientX; card.setPointerCapture(e.pointerId);
    card.style.transition = "none";
  });
  card.addEventListener("pointermove", e => {
    if(!activo) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    const p = Math.min(1, Math.abs(dx) / UMBRAL);
    si.style.opacity = dx > 0 ? p : 0;
    no.style.opacity = dx < 0 ? p : 0;
  });
  const soltar = () => {
    if(!activo) return;
    activo = false;
    if(Math.abs(dx) >= UMBRAL){ responder(paso, dx > 0); return; }
    card.style.transition = "transform .22s cubic-bezier(.22,1,.36,1)";
    card.style.transform = "translateX(0) rotate(0)";
    si.style.opacity = 0; no.style.opacity = 0; dx = 0;
  };
  card.addEventListener("pointerup", soltar);
  card.addEventListener("pointercancel", soltar);
}

/* teclado */
document.addEventListener("keydown", e => {
  const paso = FLUJO[estado.i];
  if(!paso || paso.t !== "card") return;
  if(document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
  if(e.key === "ArrowRight"){ e.preventDefault(); responder(paso, true); }
  if(e.key === "ArrowLeft"){ e.preventDefault(); responder(paso, false); }
});

/* ══════════════════════════════════════════════════════════
   ENVÍO
   ══════════════════════════════════════════════════════════ */
function armarPayload(){
  const p = {
    enviado: new Date().toISOString(),
    duracionSeg: Math.round((Date.now() - estado.inicio) / 1000),
    anios: estado.anios.join(" | "),
    nombre: estado.contacto.nombre,
    whatsapp: estado.contacto.whatsapp,
    mentoria: estado.contacto.mentoria ? "SI" : "NO"
  };
  CARDS.forEach(c => { p[c.id] = estado.respuestas[c.id] === true ? "SI" : "NO"; });
  FLUJO.filter(s => s.t === "abierta").forEach(s => { p[s.id] = estado.textos[s.id] || ""; });
  return p;
}

async function enviar(){
  const btn = document.getElementById("send");
  const box = document.getElementById("errbox");
  estado.contacto.nombre = document.getElementById("nom").value.trim();
  estado.contacto.whatsapp = document.getElementById("wa").value.trim();
  estado.contacto.mentoria = document.getElementById("men").checked;

  btn.disabled = true; btn.textContent = "Enviando…"; box.innerHTML = "";
  const payload = armarPayload();

  try{
    const r = await fetch(CONFIG.endpoint, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "El servidor rechazó el envío");
    gracias();
  } catch(err){
    // Reintento a ciegas: sirve cuando el bloqueo es solo de CORS
    try{
      await fetch(CONFIG.endpoint, {
        method: "POST", mode: "no-cors",
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify(payload)
      });
      gracias();
    } catch(e2){
      btn.disabled = false; btn.textContent = "Reintentar envío";
      box.innerHTML = `<div class="err">No se pudo enviar. Revisa tu conexión y vuelve a intentar. Si sigue fallando, avísale a la Red de Hombres. Tus respuestas no se pierden mientras no cierres esta página.</div>`;
    }
  }
}

portada();
</script>
